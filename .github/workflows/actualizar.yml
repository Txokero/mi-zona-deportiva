name: Actualizar noticias y resultados deportivos

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install feedparser requests beautifulsoup4

      - name: Actualizar noticias
        run: python update_news.py

      - name: Actualizar resultados y próximos partidos de LaLiga
        run: python update_matches.py

      - name: Actualizar fotografías de jugadores
        run: python update_photos.py

      - name: Guardar noticias actualizadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json club-data.json
          git diff --cached --quiet || git commit -m "Actualizar noticias y datos deportivos"
          git push
